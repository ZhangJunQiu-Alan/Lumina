name: Deploy Supabase Functions

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
    types:
      - completed

concurrency:
  group: supabase-functions-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 0
          fi
          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        if: steps.preflight.outputs.skip_deploy != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.skip_deploy != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Enable AI content features
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set LUMINA_AI_FEATURES_ENABLED=true --project-ref zhjdsvcgccdvtnicyasi

      - name: Deploy api function
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy api --project-ref zhjdsvcgccdvtnicyasi --no-verify-jwt
