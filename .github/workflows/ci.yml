name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run review rule tests
        run: npm run test:review

      - name: Run learning session tests
        run: npm run test:session

      - name: Run word batch tests
        run: npm run test:word-batch

      - name: Verify production build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          VITE_API_BASE_URL: https://api-production-0052.up.railway.app
          VITE_GOOGLE_AUTH_ENABLED: "false"
        run: npm run build
