name: Deploy Pages

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
    types:
      - completed

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check deployment secrets
        id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          missing=()
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Missing GitHub secrets: ${missing[*]}"
            exit 0
          fi

          echo "skip_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        if: steps.preflight.outputs.skip_deploy != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        if: steps.preflight.outputs.skip_deploy != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: npm ci

      - name: Build site
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}
          VITE_AI_CONTENT_FEATURES_ENABLED: ${{ vars.VITE_AI_CONTENT_FEATURES_ENABLED }}
          VITE_IELTS_LISTENING_ENABLED: ${{ vars.VITE_IELTS_LISTENING_ENABLED }}
          VITE_PERSONAL_VOCAB_IMPORT_ENABLED: ${{ vars.VITE_PERSONAL_VOCAB_IMPORT_ENABLED }}
        run: npm run build

      - name: Check production API gateway
        if: steps.preflight.outputs.skip_deploy != 'true'
        run: npm run check:production-api-base

      - name: Deploy to Cloudflare Pages
        if: steps.preflight.outputs.skip_deploy != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=lumina --branch=${{ github.event.workflow_run.head_branch }}
